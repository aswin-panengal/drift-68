name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Validate the requested GitHub release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run worker:check
      - name: Bundle the Worker locally
        run: npm exec -- wrangler deploy --config server/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/drift-worker"
      - name: Build, type-check, and verify release archives
        run: |
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_args=(--tag "$RELEASE_TAG")
          elif [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          python scripts/package-release.py release "${tag_args[@]}"
          if (( ${#tag_args[@]} )); then
            python scripts/package-release.py "$RUNNER_TEMP/drift-rebuild" "${tag_args[@]}"
            diff release/SHA256SUMS.txt "$RUNNER_TEMP/drift-rebuild/SHA256SUMS.txt"
          fi
          git rev-parse HEAD > release/SOURCE_COMMIT.txt
      - name: Match the public GitHub release assets
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/drift-public" \
            --pattern "drift-68-${RELEASE_TAG#v}.vsix" \
            --pattern SHA256SUMS.txt --pattern SOURCE_COMMIT.txt
          cmp release/SHA256SUMS.txt "$RUNNER_TEMP/drift-public/SHA256SUMS.txt"
          cmp release/SOURCE_COMMIT.txt "$RUNNER_TEMP/drift-public/SOURCE_COMMIT.txt"
          cmp "release/drift-68-${RELEASE_TAG#v}.vsix" "$RUNNER_TEMP/drift-public/drift-68-${RELEASE_TAG#v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drift-68-release
          path: release/
          if-no-files-found: error
          retention-days: 14
